name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    # Run automated scan weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Aqua Security Trivy Scanner (Docker Hub Image)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          image-ref: 'babak60/pdftoagent-stock-market-barometer-hamilton:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

      - name: Generate SARIF Security Report
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          image-ref: 'babak60/pdftoagent-stock-market-barometer-hamilton:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
