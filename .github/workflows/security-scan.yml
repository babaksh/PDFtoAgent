name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    # Run automated scan weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Aqua Security Trivy Scanner (Docker Hub Image)
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          image-ref: 'babak60/pdftoagent-stock-market-barometer-hamilton:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: false
          severity: 'CRITICAL,HIGH'

      - name: Generate SARIF Security Report
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0 # master
        with:
          image-ref: 'babak60/pdftoagent-stock-market-barometer-hamilton:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
